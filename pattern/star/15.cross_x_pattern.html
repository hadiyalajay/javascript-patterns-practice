<script>
  let str = "";
  let n = 7;

  for (let i = 1; i <= 5; i++) {
    for (let j = 1; j <= 5; j++) {
      if (j == i || j == n - i - 1) {
        str += "x";
      } else {
        str += " ";
      }
    }

    str += "\n";
  }

  console.log(str);
</script>
