<script>
  function fahrenheitToCelsius() {
    let fahrenheit = prompt("Enter temperature in Fahrenheit : ");

    const celsius = (fahrenheit - 32) / 1.8;
    console.log("Fahrenheit to celsius :- ", celsius);
  }

  fahrenheitToCelsius();
</script>
