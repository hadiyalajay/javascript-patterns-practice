<script>
  let str = "";

  for (let i = 1; i <= 5; i++) {
    for (let k = 5; k >= i; k--) {
      str += "  ";
    }

    for (let j = 1; j <= i * 2 - 1; j++) {
      str += i + " ";
    }

    str += "\n";
  }

  console.log(str);
</script>
