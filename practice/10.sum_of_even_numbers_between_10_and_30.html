<script>
  let sum = 0;
  let start = 10;
  let end = 30;

  for (let i = start + 1; i <= end - 1; i++) {
    if (i % 2 == 0) {
      sum = sum + i;
    }
  }

  console.log("sum of even numbers between 10 and 30 :- ", sum);
</script>
