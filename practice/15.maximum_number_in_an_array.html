<script>
  let num = [1, 13, 3, 2, 25, 7, 9, 19, 6, 4, 8, 23, 5, 10, 24];
  let max = num[0];

  num.forEach((n) => {
    if (n > max) {
      max = n;
    }
  });

  console.log("maximum number in an array : ", max);
</script>
