<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <p id="num"></p>
  </body>
</html>
<script>
  let n = prompt("Enter Number");
  let str = "";

  for (let i = 1; i <= 10; i++) {
    str += `${n} * ${i} = ${n * i}`;
    str += "<br/>";
  }

  document.getElementById("num").innerHTML = str;
</script>
